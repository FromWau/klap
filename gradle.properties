kotlin.code.style=official
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
# Preferred mode per the Gradle golden path. If a plugin/target misbehaves under it during Task 1,
# comment this line out (per-build) rather than abandoning the build cache above.
org.gradle.configuration-cache=true
kotlin.native.ignoreDisabledTargets=true
android.useAndroidX=true
android.sync.suppressAgpWarnings=GENERIC